# ByteArena infrastructure.
#
# This file ships with the INFRASTRUCTURE services only (postgres, kafka, kafka-init).
# The builder adds each application service in the phase that creates it
# (templates at the bottom, commented out). Conventions for those services:
#   - build context is the repo root (npm workspaces + packages/shared), dockerfile per service
#   - config via environment variables; inside compose use the INTERNAL addresses:
#       DATABASE_URL=postgres://bytearena:bytearena@postgres:5432/bytearena
#       KAFKA_BROKERS=kafka:9092
#       SUBMISSION_GRPC_ADDR=submission-api:50051
#   - every service that can have a healthcheck gets one, and depends_on uses service_healthy

name: bytearena

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bytearena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bytearena}
      POSTGRES_DB: ${POSTGRES_DB:-bytearena}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only on the FIRST start of an empty volume. After changing init.sql run:
      #   docker compose down -v
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0   # KRaft mode, no Zookeeper
    hostname: kafka
    ports:
      - "29092:29092"           # host access (localhost:29092); containers use kafka:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # topics are created explicitly by kafka-init
    # No volume on purpose: `docker compose stop/start kafka` keeps data (chaos tests rely on it),
    # `docker compose down` resets it. Do not run `down` between chaos steps.
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        T=/opt/kafka/bin/kafka-topics.sh
        B=kafka:9092
        $$T --bootstrap-server $$B --create --if-not-exists --topic submissions.queued  --partitions 3 --replication-factor 1
        $$T --bootstrap-server $$B --create --if-not-exists --topic submissions.results --partitions 3 --replication-factor 1
        $$T --bootstrap-server $$B --create --if-not-exists --topic submissions.dlq     --partitions 1 --replication-factor 1
        echo "topics ready"

  submission-api:
    build:
      context: .
      dockerfile: services/submission-service/Dockerfile
    command: ["node", "services/submission-service/dist/server.js"]
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-bytearena}:${POSTGRES_PASSWORD:-bytearena}@postgres:5432/${POSTGRES_DB:-bytearena}"
      GRPC_PORT: "50051"
    ports:
      - "50051:50051"
    depends_on:
      postgres:
        condition: service_healthy

  outbox-publisher:
    build:
      context: .
      dockerfile: services/submission-service/Dockerfile
    command: ["node", "services/submission-service/dist/outbox-publisher.js"]
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-bytearena}:${POSTGRES_PASSWORD:-bytearena}@postgres:5432/${POSTGRES_DB:-bytearena}"
      KAFKA_BROKERS: "kafka:9092"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  runner:
    build:
      context: .
      dockerfile: services/runner/Dockerfile
    environment:
      KAFKA_BROKERS: "kafka:9092"
      SUBMISSION_GRPC_ADDR: "submission-api:50051"
      RUNNER_SESSION_TIMEOUT_MS: "10000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-999}"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      submission-api:
        condition: service_started

  result-writer:
    build:
      context: .
      dockerfile: services/submission-service/Dockerfile
    command: ["node", "services/submission-service/dist/result-writer-main.js"]
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-bytearena}:${POSTGRES_PASSWORD:-bytearena}@postgres:5432/${POSTGRES_DB:-bytearena}"
      KAFKA_BROKERS: "kafka:9092"
      RUNNER_SESSION_TIMEOUT_MS: "10000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    ports:
      - "4000:4000"
    environment:
      SUBMISSION_GRPC_ADDR: "submission-api:50051"
      KAFKA_BROKERS: "kafka:9092"
      GATEWAY_PORT: "4000"
    depends_on:
      submission-api:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully

volumes:
  pgdata:

# ---------------------------------------------------------------------------
