name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate gRPC Proto Types
        run: npm run proto:gen

      - name: Build TypeScript Packages
        run: npm run build

      - name: Run ESLint
        run: npm run lint

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Unit Tests
        run: npx vitest run

  integration:
    name: Docker Compose Integration & Smoke
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Pre-pull Sandbox Images
        run: |
          docker pull python:3.12-alpine
          docker pull node:20-alpine

      - name: Configure environment
        run: |
          cp .env.example .env
          # In Ubuntu CI runner, Docker socket GID is typically docker group
          DOCKER_SOCK_GID=$(stat -c '%g' /var/run/docker.sock)
          echo "DOCKER_GID=$DOCKER_SOCK_GID" >> .env
          echo "POSTGRES_HOST_PORT=5434" >> .env
          echo "DATABASE_URL=postgres://bytearena:bytearena@localhost:5434/bytearena" >> .env

      - name: Start Docker Compose services
        run: docker compose up -d --build

      - name: Wait for PostgreSQL and Kafka health
        run: |
          echo "Waiting for services to become healthy..."
          for i in $(seq 1 30); do
            PG_STATUS=$(docker compose ps postgres --format "{{.Health}}")
            KAFKA_STATUS=$(docker compose ps kafka --format "{{.Health}}")
            if [ "$PG_STATUS" = "healthy" ] && [ "$KAFKA_STATUS" = "healthy" ]; then
              echo "Services healthy!"
              break
            fi
            sleep 2
          done

      - name: Run Smoke Test
        run: bash scripts/smoke.sh

      - name: Run Chaos Test Suite
        run: bash scripts/chaos/run-all.sh
